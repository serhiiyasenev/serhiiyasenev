name: Audit public repository Git histories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/public-repository-secret-audit.yml]
  schedule:
    - cron: '18 3 * * 1'

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.inventory.outputs.repositories }}
    steps:
      - name: Enumerate public repositories
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repos=$(gh api --paginate 'users/serhiiyasenev/repos?per_page=100&type=owner' --jq '.[] | select(.private == false) | .name' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          jq -e 'type == "array" and length > 0' <<< "$repos" > /dev/null
          printf 'repositories=%s\n' "$repos" >> "$GITHUB_OUTPUT"
          printf 'Discovered %s public repositories\n' "$(jq length <<< "$repos")" >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        repository: ${{ fromJSON(needs.enumerate.outputs.repositories) }}
    steps:
      - name: Download verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
      - name: Scan all reachable repository history
        shell: bash
        env:
          REPOSITORY_NAME: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || exit 2
          git clone --quiet --no-checkout "https://github.com/serhiiyasenev/$REPOSITORY_NAME.git" "$RUNNER_TEMP/target"
          set +e
          "$RUNNER_TEMP/gitleaks" git "$RUNNER_TEMP/target" --no-banner --redact=100 --report-format json --report-path "$RUNNER_TEMP/leaks.json" > "$RUNNER_TEMP/gitleaks.log" 2>&1
          status=$?
          set -e
          count=0
          if [[ -f "$RUNNER_TEMP/leaks.json" ]]; then
            count=$(jq -er 'if type == "array" then length else error("Invalid report") end' "$RUNNER_TEMP/leaks.json")
          fi
          {
            printf '### %s\n' "$REPOSITORY_NAME"
            printf 'Potential historical findings: %s\n' "$count"
            printf 'Findings are intentionally not uploaded or printed to public logs.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( status == 1 )); then
            echo 'Potential secrets found; investigate and rotate verified credentials' >&2
            exit 1
          fi
          if (( status != 0 )); then
            echo 'Gitleaks scan failed; this repository was not verified' >&2
            if grep -q 'not a git repository' "$RUNNER_TEMP/gitleaks.log"; then echo 'Diagnostic: source is not a Git repository' >&2; fi
            if grep -q 'unknown flag' "$RUNNER_TEMP/gitleaks.log"; then echo 'Diagnostic: invalid CLI flag' >&2; fi
            if grep -q 'git log' "$RUNNER_TEMP/gitleaks.log"; then echo 'Diagnostic: Git log invocation failed' >&2; fi
            exit 2
          fi
